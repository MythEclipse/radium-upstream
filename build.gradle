import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'dev.architectury.loom' version '1.10.437'

    // Vineflower is a fork of the FernFlower decompiler which contains many enhancements and bug fixes, and generally
    // produces much better source code. The Minecraft sources can be decompiled using it with the
    // "genSourcesWithVineflower" task.
    // (Note: Quiltflower was renamed to Vineflower in early July 2023.)
// id 'io.github.juuxel.loom-vineflower' version '1.11.0'

    // This dependency is only used to determine the state of the Git working tree so that build artifacts can be
    // more easily identified. TODO: Lazily load GrGit via a service only when builds are performed.
    id 'org.ajoberstar.grgit' version '5.3.3'

    // Mixin config plugin is a subproject for creating lithium's settings from annotations in each mixin package.
    id 'net.caffeinemc.mixin-config-plugin' version '1.0-SNAPSHOT'

    id 'maven-publish'
}

apply from: "${rootProject.projectDir}/gradle/fabric.gradle"
apply from: "${rootProject.projectDir}/gradle/java.gradle"

apply plugin: 'net.caffeinemc.mixin-config-plugin'

loom {
    accessWidenerPath = file("src/main/resources/lithium.accesswidener")
    mixin.defaultRefmapName = "mixins.lithium.refmap.json"

    forge {
        convertAccessWideners = true

        mixinConfig "lithium.mixins.json"
    }
}

group = project.maven_group
version = "${project.mod_version}${getVersionMetadata()}"
base {
    archivesName = "${project.name}-mc${project.minecraft_version}"
}

sourceSets {
    api {
        java {
            compileClasspath += main.compileClasspath
        }
    }

    main {
        java {
            compileClasspath += api.output
            runtimeClasspath += api.output
        }
    }
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set "api-dev"

    from sourceSets.api.output
}

tasks.register('remapApiJar', RemapJarTask) {
    dependsOn apiJar
    archiveClassifier.set("api")

    input = apiJar.archiveFile.get().asFile
    addNestedDependencies = false
}

build.dependsOn remapApiJar

jar {
    from sourceSets.main.output
    from sourceSets.api.output
    manifest {
        attributes([
            "Specification-Title": "radium",
            "Specification-Vendor": "Reforged Hub",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${project.mod_version}",
            "Implementation-Vendor" :"Reforged Hub",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "lithium.mixins.json"
        ])
    }
}

loom {
    runs {
        configureEach {
            mods {
                radium {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.api
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    allprojects {
        repositories {
            flatDir { dirs 'libs' }
            maven { url 'https://jitpack.io' }
            maven { url "https://maven.su5ed.dev/releases" }
            maven { url "https://repo.constructlegacy.ru/public" }
            maven { url "https://maven.caffeinemc.net/" }
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
                content {
                    includeGroup "maven.modrinth"
                }
            }
            maven {
                name = "Valkyrien Skies Internal"
                url = "https://maven.valkyrienskies.org"
            }
            maven {
                name = "RealRobotix"
                url = "https://maven.realrobotix.me/master/"
            }
            mavenCentral()
        }
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    forge "net.minecraftforge:forge:${project.loader_version}"
    modCompileOnly "dev.su5ed.sinytra.fabric-api:fabric-transfer-api-v1:${project.fabric_version}" // Ye

    // VS2 (Fat Jar with API merged)
    // modImplementation name: 'vs2-fat'
    
    // Core internal/impl/util still needed if not merged? 
    // Assuming vs2-lat.jar only has API + Main Mod.
    // The main mod likely depends on impl/util at runtime.
    // Let's keep them as modImplementation for safety, or implementation.
    // But since vs2-fat is a "mod", it might work better.
    // modImplementation name: 'internal-fixed'
    // modImplementation name: 'util-fixed'
    // modImplementation name: 'impl-fixed'
    
    modImplementation "maven.modrinth:kotlin-for-forge:4.11.0"

    // C2ME (Using direct Version ID from Modrinth)
    modImplementation "maven.modrinth:c2me-fabric:s4WOiNtz"

    // MixinExtras (Required by VS2)
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.3")

    // Inlined implementation in me.jellysquid.mods.lithium.common.config.caffeine
    implementation("org.joml:joml:1.10.8") { transitive = false }
    implementation("org.joml:joml-primitives:1.10.0") { transitive = false }
}

createMixinConfig {
    inputFiles = compileJava.destinationDirectory
    includeFiles = file("src/main/java/me/jellysquid/mods/lithium/mixin")
    outputDirectory = file("src/main/resources/assets/lithium/")
    outputDirectoryForSummaryDocument = file(".")
    mixinParentPackage = "me.jellysquid.mods.lithium"
    modShortName = "Radium"
}

jar.dependsOn createMixinConfig
processResources.dependsOn createMixinConfig
createMixinConfig.dependsOn compileJava

def getVersionMetadata() {
    // CI builds only
    if (project.hasProperty("build.release")) {
        return "" // no tag whatsoever
    }

    if (grgit != null) {
        def head = grgit.head()
        def id = head.abbreviatedId

        // Flag the build if the build tree is not clean
        if (!grgit.status().clean) {
            id += "-dirty"
        }

        return "+git.${id}"
    }

    // No tracking information could be found about the build
    return "+unknown"
}

//make builds more reproducible
tasks.withType(AbstractArchiveTask) {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

